services:
  classifier-service:
    build: ./classifier-service
    ports:
      - "8080:8080"
    environment:
      MODEL_ID: "facebook/bart-large-mnli"
      CANDIDATE_LABELS: "Zustimmung,sachliche Kritik,Empörung,Beleidigung oder persönlicher Angriff"
      BATCH_WINDOW_MS: "200"
      MAX_BATCH_SIZE: "8"
      MAX_QUEUE_SIZE: "256"
      HF_HOME: "/models"
      TRANSFORMERS_CACHE: "/models"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - hf-cache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      classifier-service:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  hf-cache:
